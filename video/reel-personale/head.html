<!doctype html><html lang="it"><head><meta charset="utf-8"><style>
@font-face{font-family:Nunito;font-weight:600;src:url(../../fonts/nunito-latin-600-normal.woff2)}
@font-face{font-family:Nunito;font-weight:800;src:url(../../fonts/nunito-latin-800-normal.woff2)}
@font-face{font-family:Nunito;font-weight:900;src:url(../../fonts/nunito-latin-900-normal.woff2)}
@font-face{font-family:Literata;font-weight:400;src:url(../../fonts/literata-latin-400-normal.woff2)}
:root{--surface:#FBF8F5;--line:#EAE3DB;--ink:#1E2B5C;--muted:#5A6488;--teal:#1E9E9E;--teal-text:#0F6F6F;--teal-soft:#A8E6DD;--peri:#4A5BE8;--peri-soft:#DDE0FB;--coral:#F09B7C;--coral-text:#A64A30;--coral-soft:#FBE3D8}
*{box-sizing:border-box;margin:0}
body{background:#999;font-family:Nunito,sans-serif;color:var(--ink)}
.clip{width:1080px;height:960px;position:relative;overflow:hidden;background:var(--surface);display:flex;flex-direction:column;padding:120px 90px 70px;margin-bottom:20px}
.kick{font-weight:800;font-size:26px;letter-spacing:.2em;color:var(--teal-text);margin-bottom:18px;animation:up .6s ease-out both}
.kick.peri{color:var(--peri)}
h1{font-weight:900;font-size:84px;line-height:1.02;letter-spacing:-.03em;margin-bottom:34px}
.long h1{font-size:70px}.l2 h1{font-size:62px}
h1 em{font-style:normal;color:var(--coral-text)}
h1 .we,.mark .we{color:var(--peri)} h1 .self,.mark .self{color:var(--teal)}
.w{display:inline-block;animation:up .65s cubic-bezier(.2,.7,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(24px)}}
.card{flex:1;border-radius:44px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;animation:card .8s cubic-bezier(.2,.7,.2,1) .45s both}
@keyframes card{from{opacity:0;transform:translateY(30px) scale(.97)}}
.g-sea{background:radial-gradient(circle at 15% 10%,#FBE3D8 0,transparent 45%),radial-gradient(circle at 90% 95%,#A8E6DD 0,transparent 55%),#fff}
.g-warm{background:radial-gradient(circle at 10% 0%,#FBE3D8 0,transparent 55%),radial-gradient(circle at 95% 90%,#CFF0EA 0,transparent 50%),#fff}
.g-we{background:radial-gradient(circle at 85% 10%,#DDE0FB 0,transparent 55%),radial-gradient(circle at 5% 95%,#FBE3D8 0,transparent 45%),#fff}
.ill{height:88%;max-width:92%}
.pop{animation:pop .6s cubic-bezier(.2,.8,.3,1.2) both}
@keyframes pop{from{opacity:0;translate:0 18px}}
/* phone card */
.phonecard{overflow:visible}
.phone{height:400px;aspect-ratio:600/1153;border-radius:44px;background:#141a3a;padding:10px;box-shadow:0 30px 60px rgba(30,43,92,.25);animation:pop .8s cubic-bezier(.2,.8,.3,1.1) .8s both}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:36px;display:block}
.chip{position:absolute;display:inline-flex;align-items:center;gap:12px;background:#fff;border-radius:999px;padding:16px 26px;font-weight:800;font-size:28px;box-shadow:0 12px 30px rgba(30,43,92,.14);animation:pop .6s cubic-bezier(.2,.8,.3,1.3) both}
.chip svg{width:30px;height:30px;fill:none;stroke:var(--teal);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.chip i{width:18px;height:18px;border-radius:50%;background:#F1EBE4}.chip i.on{background:var(--teal)}
.chip .dot{width:14px;height:14px;border-radius:50%;background:var(--coral)}
.c1{left:90px;top:120px;animation-delay:1.4s}.c2{right:70px;top:60px;animation-delay:1.7s}.c3{right:90px;bottom:70px;animation-delay:2s}
/* end card */
.full{height:1920px;padding:300px 90px 0}
.xl{font-size:110px}
.heroart{height:640px;margin:10px -30px 0;display:flex;justify-content:center}
.heroart .ill{height:100%;max-width:100%}
.handle{font-weight:900;font-size:80px;letter-spacing:-.025em;margin-top:30px}
.chans{display:flex;gap:16px;margin-top:22px}
.chans span{font-weight:800;font-size:30px;background:#fff;border:3px solid var(--line);border-radius:999px;padding:12px 28px}
.beta{margin-top:44px;background:var(--peri);color:#fff;border-radius:32px;padding:34px 40px;max-width:800px;box-shadow:0 20px 40px rgba(74,91,232,.3)}
.beta b{display:block;font-weight:900;font-size:44px}.beta span{display:block;font-weight:600;font-size:32px;opacity:.92;margin-top:6px}
.mark{display:flex;align-items:center;gap:16px;margin-top:50px;font-weight:900;font-size:50px;letter-spacing:-.02em}.mark img{width:70px;height:70px}
.bg.g-sea,.bg.g-we,.bg.g-warm{border-radius:0}
</style></head><body>
