<!-- «Il bias della settimana»: append after head.html (cat head.html bias.html body.html > slides.html) -->
<style>
/* rubric strip, used on the cover */
.rub{display:flex;align-items:center;gap:22px}
.rub .lens{width:84px;height:84px;flex:none}
.rub .rt{display:flex;flex-direction:column;gap:4px}
.rub .rn{font-weight:900;font-size:34px;letter-spacing:.02em;line-height:1.05;color:var(--ink)}
.rub .rn em{font-style:normal;color:var(--coral-text)}
.rub .rs{font-family:'Literata',serif;font-style:italic;font-size:30px;color:var(--muted)}
/* occhiello: the situation line above the bias name */
.occ{font-weight:800;font-size:28px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral-text)}
/* episode tag in the top bar of inner slides */
.ep{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral-text)}
.ep svg{width:30px;height:30px}
/* cover: a coral band on the left edge marks the column in the grid */
.slide.biascover{box-shadow:inset 18px 0 0 var(--coral)}
.slide.biascover .rub{padding-bottom:20px;border-bottom:3px solid var(--line)}
/* «Il trucco» box on the last content slide */
.trucco{background:var(--teal-soft);border-radius:28px;padding:30px 36px;display:flex;flex-direction:column;gap:12px}
.trucco small{font-weight:800;font-size:23px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal-text)}
.trucco b{font-weight:900;font-size:44px;line-height:1.2}
.trucco p{font-weight:600;font-size:32px;line-height:1.35}
.next{margin-top:auto;margin-bottom:22px;font-weight:800;font-size:31px;line-height:1.3;color:var(--peri)}
.next + .src{margin-top:0}
.mid{font-weight:600;font-size:38px;line-height:1.4}
</style>
