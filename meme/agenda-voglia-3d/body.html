    <div class="grid4"><div class="pnl"><img src="3d/p1.png"><span class="time">ORE 9:00</span><svg width="470" height="500" viewBox="0 0 470 500"><rect x="20" y="40" width="300" height="100" rx="22" fill="#fff" stroke="#1E2B5C" stroke-width="5"/><path d="M96.0 137 L84.0 168 L124.0 137" fill="#fff" stroke="#1E2B5C" stroke-width="5" stroke-linejoin="round"/><rect x="94.0" y="130" width="32" height="12" fill="#fff"/><text x="170.0" y="85.0" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="25" fill="#1E2B5C">Oggi UNA cosa sola:</text><text x="170.0" y="115.0" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="25" fill="#1E2B5C">alle 18 camminiamo.</text><rect x="250" y="150" width="200" height="90" rx="22" fill="#FFE6DC" stroke="#1E2B5C" stroke-width="5"/><path d="M296.0 237 L284.0 268 L324.0 237" fill="#FFE6DC" stroke="#1E2B5C" stroke-width="5" stroke-linejoin="round"/><rect x="294.0" y="230" width="32" height="12" fill="#FFE6DC"/><text x="350.0" y="189.6" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="27" fill="#1E2B5C">UNA COSA!</text><text x="350.0" y="222.0" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="27" fill="#1E2B5C">Ricevuto!</text></svg></div><div class="pnl"><img src="3d/p2.png"><span class="time">ORE 17:58</span><svg width="470" height="500" viewBox="0 0 470 500"><rect x="200" y="24" width="250" height="80" rx="22" fill="#FFF3C4" stroke="#1E2B5C" stroke-width="5"/><path d="M361.0 101 L401.0 132 L389.0 101" fill="#FFF3C4" stroke="#1E2B5C" stroke-width="5" stroke-linejoin="round"/><rect x="359.0" y="94" width="32" height="12" fill="#FFF3C4"/><text x="325.0" y="59.4" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="23" fill="#1E2B5C">È uscito il</text><text x="325.0" y="87.0" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="23" fill="#1E2B5C">nuovo episodio!</text><rect x="40" y="150" width="190" height="64" rx="22" fill="#FF
